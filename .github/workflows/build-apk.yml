name: Build MuseCraft Signed APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Signed Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Prepare MuseCraft signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "KEYSTORE_BASE64 GitHub Secret bulunamadı."
            exit 1
          fi

          if [ -z "$STORE_PASSWORD" ]; then
            echo "STORE_PASSWORD GitHub Secret bulunamadı."
            exit 1
          fi

          if [ -z "$KEY_PASSWORD" ]; then
            echo "KEY_PASSWORD GitHub Secret bulunamadı."
            exit 1
          fi

          KEYSTORE_FILE="$RUNNER_TEMP/MuseCraft-release.jks"

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"

          if [ ! -s "$KEYSTORE_FILE" ]; then
            echo "İmza anahtarı oluşturulamadı."
            exit 1
          fi

          keytool -list \
            -keystore "$KEYSTORE_FILE" \
            -storepass "$STORE_PASSWORD" \
            -alias musecraft

          {
            echo "KEYSTORE_PATH=$KEYSTORE_FILE"
            echo "STORE_PASSWORD=$STORE_PASSWORD"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

          echo "MuseCraft imza anahtarı hazır."

      - name: Increase Gradle download timeout
        run: |
          FILE="gradle/wrapper/gradle-wrapper.properties"

          if grep -q '^networkTimeout=' "$FILE"; then
            sed -i 's/^networkTimeout=.*/networkTimeout=120000/' "$FILE"
          else
            echo 'networkTimeout=120000' >> "$FILE"
          fi

      - name: Build Signed Debug APK with retries
        run: |
          for attempt in 1 2 3; do
            echo "APK derleme denemesi: $attempt / 3"

            if ./gradlew assembleDebug --stacktrace; then
              echo "APK başarıyla oluşturuldu."
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "Derleme başarısız. 15 saniye sonra yeniden denenecek."
              sleep 15
            fi
          done

          echo "Üç deneme de başarısız oldu."
          exit 1

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MuseCraft-Signed-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
